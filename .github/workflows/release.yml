# Tech Kadak app — naya version release karo:
#   git tag v1.0.1 && git push origin v1.0.1
# Ye workflow APK build + sign karke GitHub Release me daal deta hai.
# Phone me installed app launch pe ye Release dekhta hai aur "Naya update aaya" dikhata hai.
#
# Repo → Settings → Secrets and variables → Actions me ye 4 secrets chahiye:
#   TK_KEYSTORE_BASE64   = keystore (.jks) file ka base64   (base64 -w0 techkadak-app-release.jks)
#   TK_KEYSTORE_PASSWORD = keystore password
#   TK_KEY_ALIAS         = techkadak
#   TK_KEY_PASSWORD      = key password
# Hamesha WAHI keystore use karna jo v1.0 me tha — warna phone pe update install nahi hoga.
name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (jaise 1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version tag se nikaalo
        id: ver
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          IFS=. read -r MA MI PA <<< "$V"
          CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $V (code $CODE)"

      - name: Keystore restore
        env:
          KS: ${{ secrets.TK_KEYSTORE_BASE64 }}
        run: |
          test -n "$KS" || { echo "TK_KEYSTORE_BASE64 secret missing"; exit 1; }
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test + build signed APK
        env:
          TK_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          TK_KEYSTORE_PASSWORD: ${{ secrets.TK_KEYSTORE_PASSWORD }}
          TK_KEY_ALIAS: ${{ secrets.TK_KEY_ALIAS }}
          TK_KEY_PASSWORD: ${{ secrets.TK_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest --tests "com.techkadak.app.DataTest" \
            :app:assembleRelease -PVERSION_NAME=${{ steps.ver.outputs.name }} -PVERSION_CODE=${{ steps.ver.outputs.code }}
          cp app/build/outputs/apk/release/app-release.apk "TechKadak-v${{ steps.ver.outputs.name }}.apk"
          "$ANDROID_HOME"/build-tools/*/apksigner verify "TechKadak-v${{ steps.ver.outputs.name }}.apk" || ls "$ANDROID_HOME/build-tools"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Tech Kadak v${{ steps.ver.outputs.name }}
          body: |
            Naya Tech Kadak update 🔥
            App khud bata dega — "Naya update aaya" pe tap karo.
          files: TechKadak-v${{ steps.ver.outputs.name }}.apk
          make_latest: true
