# Build-only: the same signed release APK as release.yml, uploaded as a workflow
# artifact. Runs only when started by hand. Creates NO GitHub Release and NO tag.
name: Build APK (artifact only)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name, e.g. 1.8.0"
        required: true
        default: "1.8.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: ver
        run: |
          V="${{ github.event.inputs.version }}"
          IFS=. read -r MA MI PA <<< "$V"
          CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $V (code $CODE)"

      - name: Keystore restore
        env:
          KS: ${{ secrets.TK_KEYSTORE_BASE64 }}
        run: |
          test -n "$KS" || { echo "TK_KEYSTORE_BASE64 secret missing"; exit 1; }
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test + build signed APK
        env:
          TK_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          TK_KEYSTORE_PASSWORD: ${{ secrets.TK_KEYSTORE_PASSWORD }}
          TK_KEY_ALIAS: ${{ secrets.TK_KEY_ALIAS }}
          TK_KEY_PASSWORD: ${{ secrets.TK_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest --tests "com.techkadak.app.DataTest" \
            :app:assembleRelease -PVERSION_NAME=${{ steps.ver.outputs.name }} -PVERSION_CODE=${{ steps.ver.outputs.code }}
          cp app/build/outputs/apk/release/app-release.apk "TechKadak-v${{ steps.ver.outputs.name }}.apk"
          "$ANDROID_HOME"/build-tools/*/apksigner verify "TechKadak-v${{ steps.ver.outputs.name }}.apk" || ls "$ANDROID_HOME/build-tools"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TechKadak-v${{ steps.ver.outputs.name }}
          path: TechKadak-v${{ steps.ver.outputs.name }}.apk
          if-no-files-found: error
          retention-days: 14
