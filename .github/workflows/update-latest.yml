name: Update latest release info
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: latest-info
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh README block and docs/latest.json from the latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, json, hashlib, re, urllib.request, datetime
          repo = os.environ["REPO"]; tok = os.environ["GH_TOKEN"]
          def api(url):
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + tok, "Accept": "application/vnd.github+json"})
              return json.load(urllib.request.urlopen(req, timeout=60))
          rel = api(f"https://api.github.com/repos/{repo}/releases/latest")
          if rel.get("draft") or rel.get("prerelease"):
              raise SystemExit("latest release is a draft/prerelease, nothing to do")
          apks = [a for a in rel["assets"] if a["name"].lower().endswith(".apk")]
          if not apks:
              raise SystemExit("latest release has no APK, leaving README untouched")
          a = apks[0]
          h = hashlib.sha256(); n = 0
          req = urllib.request.Request(a["browser_download_url"])
          with urllib.request.urlopen(req, timeout=300) as r:
              while True:
                  b = r.read(1 << 20)
                  if not b: break
                  h.update(b); n += len(b)
          if n != a["size"]:
              raise SystemExit(f"downloaded {n} bytes but release says {a['size']}")
          sha = h.hexdigest()
          date = datetime.datetime.fromisoformat(rel["published_at"].replace("Z", "+00:00")).strftime("%-d %b %Y")
          mb = f"{a['size']/1e6:.2f} MB ({a['size']:,} bytes)"
          block = ("<!-- LATEST:START -->\n| | |\n|---|---|\n"
                   f"| **Version** | **{rel['tag_name']}** |\n| **Released** | {date} |\n"
                   f"| **APK size** | {mb} |\n| **Requires** | Android 7.0+ |\n"
                   f"| **SHA-256** | `{sha}` |\n"
                   f"| **Direct APK** | [{a['name']}]({a['browser_download_url']}) |\n<!-- LATEST:END -->")
          s = open("README.md", encoding="utf-8").read()
          s2, k = re.subn(r"<!-- LATEST:START -->.*?<!-- LATEST:END -->", lambda m: block, s, flags=re.S)
          if k != 1:
              raise SystemExit("README markers not found exactly once")
          open("README.md", "w", encoding="utf-8").write(s2)
          os.makedirs("docs", exist_ok=True)
          json.dump({"version": rel["tag_name"], "published_at": rel["published_at"], "apk": a["name"],
                     "size_bytes": a["size"], "sha256": sha, "download_url": a["browser_download_url"],
                     "release_url": rel["html_url"], "min_android": "7.0"},
                    open("docs/latest.json", "w"), indent=2)
          print("updated to", rel["tag_name"], sha)
          PY
      - name: Commit if changed
        run: |
          git config user.name "tech-kadak-bot"
          git config user.email "noreply@github.com"
          git add README.md docs/latest.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Update latest release info"
          git push
