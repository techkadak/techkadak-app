# ───────── Tech Kadak app config (sirf yahan badlo) ─────────
# Website jahan se apps.json aata hai (aakhir me / mat lagao)
TK_SITE_BASE=https://techkadak.github.io
# GitHub username/repo jahan app ke Releases (update APK) bante hain
TK_GITHUB_OWNER=techkadak
TK_GITHUB_REPO=techkadak-app
# Version — release workflow tag se apne aap set karta hai (v1.2.3 -> 1.2.3 / 10203)
VERSION_NAME=1.7.2
VERSION_CODE=10702
# ────────────────────────────────────────────────────────────

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.workers.max=2
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g
